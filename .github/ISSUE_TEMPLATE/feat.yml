name: 기능 요청
description: 새 기능이나 기존 기능 확장을 제안한다
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: 기능 설명
      description: 무엇을 추가하거나 바꾸는지 간단하고 명확하게 적는다
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 배경 / 동기
      description: 왜 필요한지, 어떤 문제를 해결하는지 적는다. 확인한 사실과 추측을 구분한다
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결 방법
      description: 구현 방향, 바꿀 파일이나 구성
  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 고려했지만 채택하지 않은 방법과 그 이유
  - type: textarea
    id: acceptance
    attributes:
      label: 수락 조건
      description: 완료를 판단할 수 있는 검증 가능한 조건
      value: |
        - [ ]
  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 상위 에픽, 관련 이슈·PR, 참고 자료
