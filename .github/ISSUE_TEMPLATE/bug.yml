name: 버그 리포트
description: 의도와 다르게 동작하는 문제를 보고한다
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 무엇이 잘못됐는지 한두 문장으로 적는다
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 문제를 다시 일으키는 최소 절차
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 오류 메시지·로그는 원문 그대로 붙인다
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: OS, 관련 도구와 버전, 브랜치·커밋
  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 원인 추정, 관련 이슈·PR, 스크린샷
